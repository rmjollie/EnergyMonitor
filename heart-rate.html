<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Heart Rate</title>
<style>
  :root { --bg:#0f1115; --fg:#f2f2f2; --muted:#8a8f98; --accent:#ff3b5c; --band:#ff3b5c33; --grid:#2a2e36; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         background:var(--bg); color:var(--fg);
         font-family:system-ui,-apple-system,sans-serif; padding:24px 16px; box-sizing:border-box; }
  #bpm { font-size:clamp(72px,20vw,140px); font-weight:700; line-height:1; font-variant-numeric:tabular-nums; margin-top:8px;}
  .unit { color:var(--muted); font-size:16px; margin-bottom:16px; }
  .heart { color:var(--accent); display:inline-block; transition:transform .12s; }
  .beat { transform:scale(1.3); }
  button { background:var(--accent); color:#fff; border:0; border-radius:10px;
           padding:14px 28px; font-size:18px; cursor:pointer; }
  button.secondary { background:#2a2e36; }
  button.ghost { background:transparent; border:1px solid #2a2e36; color:var(--fg); padding:10px 18px; font-size:14px; }
  #status { color:var(--muted); margin-top:16px; font-size:14px; text-align:center; max-width:420px;}
  #rr { color:var(--muted); margin-top:4px; font-size:13px; font-variant-numeric:tabular-nums; min-height:16px; }
  .chart-wrap { width:100%; max-width:900px; margin-top:40px; }
  .chart-header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .chart-header h2 { font-size:16px; font-weight:600; margin:0; color:var(--fg); }
  .chart-header span { font-size:13px; color:var(--muted); }
  canvas { width:100%; height:220px; display:block; background:#151820; border-radius:10px; }
  .legend { display:flex; gap:18px; margin-top:8px; font-size:12px; color:var(--muted); }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .swatch { width:10px; height:10px; border-radius:2px; display:inline-block; }
</style>
</head>
<body>
  <div><span class="heart" id="heart">&#10084;</span></div>
  <div id="bpm">--</div>
  <div class="unit">BPM</div>
  <button id="connect">Connect sensor</button>
  <div id="status">Turn on your Verity Sense, then click Connect.</div>
  <div id="rr"></div>

  <div class="chart-wrap">
    <div class="chart-header">
      <h2>History</h2>
      <span id="chartRange">midnight – now</span>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px;">
      <label style="font-size:13px; color:var(--muted);">Ending
        <input type="date" id="endDate" style="margin-left:4px; background:#151820; color:var(--fg); border:1px solid #2a2e36; border-radius:6px; padding:6px;">
      </label>
      <label style="font-size:13px; color:var(--muted);">Period
        <select id="periodSelect" style="margin-left:4px; background:#151820; color:var(--fg); border:1px solid #2a2e36; border-radius:6px; padding:6px;">
          <option value="day">1 day</option>
          <option value="week">1 week</option>
          <option value="month">1 month</option>
          <option value="year">1 year</option>
        </select>
      </label>
      <button id="viewRangeBtn" class="ghost">View</button>
      <button id="todayBtn" class="ghost">Today</button>
    </div>
    <canvas id="chart" width="900" height="220"></canvas>
    <div class="legend">
      <span><span class="swatch" style="background:var(--band)"></span> min–max range</span>
      <span><span class="swatch" style="background:var(--accent)"></span> average</span>
    </div>
  </div>

  <div class="chart-wrap" style="margin-top:24px;">
    <div class="chart-header">
      <h2>Backup</h2>
      <span id="recordCount"></span>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button id="exportBtn" class="ghost">Download backup (.json)</button>
      <button id="importBtn" class="ghost">Restore from backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>
    <div id="backupStatus" style="color:var(--muted); font-size:13px; margin-top:8px;"></div>
  </div>

<script>
const HR_SERVICE = 'heart_rate';                 // 0x180D
const HR_MEASUREMENT = 'heart_rate_measurement'; // 0x2A37

const bpmEl = document.getElementById('bpm');
const statusEl = document.getElementById('status');
const rrEl = document.getElementById('rr');
const heartEl = document.getElementById('heart');
const btn = document.getElementById('connect');
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const chartRangeEl = document.getElementById('chartRange');
const endDateInput = document.getElementById('endDate');
const periodSelect = document.getElementById('periodSelect');
const viewRangeBtn = document.getElementById('viewRangeBtn');
const todayBtn = document.getElementById('todayBtn');

let device = null;
let db = null;
let redrawScheduled = false;

// The range currently shown on the chart, plus which period it represents
// ('day' | 'week' | 'month' | 'year'). The period matters beyond display:
// it decides whether the chart reads raw readings or pre-aggregated daily
// rollups (see refreshChart).
let currentRangeStart = null;
let currentRangeEnd = null;
let currentPeriod = 'day';

function setStatus(msg) { statusEl.textContent = msg; }

// ---------- IndexedDB ----------

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('heartRateDB', 2);
    req.onupgradeneeded = (e) => {
      const database = req.result;
      if (e.oldVersion < 1) {
        const store = database.createObjectStore('readings', { keyPath: 'id', autoIncrement: true });
        store.createIndex('byTime', 't');
      }
      if (e.oldVersion < 2) {
        // One row per calendar day: { day: 'YYYY-MM-DD', min, max, sum, count }.
        // Kept up to date incrementally (see updateRollup) so a month/year
        // chart can read ~30-365 small rows instead of every raw reading.
        database.createObjectStore('dailyRollups', { keyPath: 'day' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// Local calendar-day key, e.g. "2026-09-26". Local time on purpose — a
// day's rollup should match the day the person actually experienced.
function dayKeyLocal(ms) {
  const d = new Date(ms);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

// Merge one reading into that day's rollup row, inside the given transaction
// (so it commits atomically alongside the raw-reading write).
function updateRollup(tx, bpm, t) {
  const store = tx.objectStore('dailyRollups');
  const key = dayKeyLocal(t);
  const req = store.get(key);
  req.onsuccess = () => {
    const existing = req.result;
    if (existing) {
      existing.min = Math.min(existing.min, bpm);
      existing.max = Math.max(existing.max, bpm);
      existing.sum += bpm;
      existing.count += 1;
      store.put(existing);
    } else {
      store.put({ day: key, min: bpm, max: bpm, sum: bpm, count: 1 });
    }
  };
}

function saveReading(bpm, t = Date.now()) {
  const tx = db.transaction(['readings', 'dailyRollups'], 'readwrite');
  tx.objectStore('readings').add({ t, bpm });
  updateRollup(tx, bpm, t);
}

function countStore(name) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(name, 'readonly');
    const req = tx.objectStore(name).count();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// Rebuild every daily rollup from scratch by scanning all raw readings.
// Used once, on first load after this feature is added (so existing history
// gets rollups too), and after a backup import (since bulkSaveReadings
// writes raw readings directly and doesn't touch rollups incrementally).
async function rebuildRollups() {
  const all = await getAllReadings();
  const byDay = new Map();
  for (const r of all) {
    const key = dayKeyLocal(r.t);
    const agg = byDay.get(key);
    if (!agg) byDay.set(key, { day: key, min: r.bpm, max: r.bpm, sum: r.bpm, count: 1 });
    else {
      agg.min = Math.min(agg.min, r.bpm);
      agg.max = Math.max(agg.max, r.bpm);
      agg.sum += r.bpm;
      agg.count += 1;
    }
  }
  return new Promise((resolve, reject) => {
    const tx = db.transaction('dailyRollups', 'readwrite');
    const store = tx.objectStore('dailyRollups');
    store.clear();
    for (const agg of byDay.values()) store.put(agg);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// Fetch all readings between two timestamps (ms since epoch)
function getReadingsInRange(start, end) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('readings', 'readonly');
    const index = tx.objectStore('readings').index('byTime');
    const range = IDBKeyRange.bound(start, end);
    const out = [];
    index.openCursor(range).onsuccess = (e) => {
      const cursor = e.target.result;
      if (cursor) { out.push(cursor.value); cursor.continue(); }
      else resolve(out);
    };
    index.openCursor(range).onerror = (e) => reject(e.target.error);
  });
}

// Fetch daily rollup rows covering [start, endExclusive). Since the store's
// key is the "YYYY-MM-DD" day string, a plain lexicographic range works —
// no separate index needed.
function getRollupsInRange(start, endExclusive) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('dailyRollups', 'readonly');
    const store = tx.objectStore('dailyRollups');
    const startKey = dayKeyLocal(start);
    const endKey = dayKeyLocal(Math.max(start, endExclusive - 1));
    const range = IDBKeyRange.bound(startKey, endKey);
    const req = store.getAll(range);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// ---------- Bucketing ----------

// Pick a bucket width so a chart never has to draw more than ~400-500 points,
// however wide the selected range is. A single day stays at 1-minute buckets;
// a 2-week range automatically steps up to something coarser.
function bucketSizeFor(rangeMs) {
  const steps = [
    60e3,            // 1 min
    5 * 60e3,        // 5 min
    15 * 60e3,       // 15 min
    30 * 60e3,       // 30 min
    60 * 60e3,       // 1 hour
    3 * 60 * 60e3,   // 3 hours
    6 * 60 * 60e3,   // 6 hours
    24 * 60 * 60e3   // 1 day
  ];
  const target = rangeMs / 400;
  for (const s of steps) if (target <= s) return s;
  return steps[steps.length - 1];
}

// Group raw readings into fixed-size time buckets, keeping min/avg/max per bucket.
function bucketReadings(readings, bucketMs, rangeStart, rangeEnd) {
  const bucketCount = Math.ceil((rangeEnd - rangeStart) / bucketMs);
  const buckets = new Array(bucketCount).fill(null);

  for (const r of readings) {
    const idx = Math.floor((r.t - rangeStart) / bucketMs);
    if (idx < 0 || idx >= bucketCount) continue;
    if (!buckets[idx]) buckets[idx] = { min: r.bpm, max: r.bpm, sum: r.bpm, count: 1 };
    else {
      const b = buckets[idx];
      b.min = Math.min(b.min, r.bpm);
      b.max = Math.max(b.max, r.bpm);
      b.sum += r.bpm;
      b.count++;
    }
  }

  return buckets.map((b, i) => b ? {
    t: rangeStart + i * bucketMs,
    min: b.min,
    max: b.max,
    avg: b.sum / b.count
  } : null);
}

// Same output shape as bucketReadings, but from pre-aggregated daily rollup
// rows instead of raw readings — one bucket per calendar day, no further
// aggregation needed since the rollup is already day-granularity.
function bucketsFromRollups(rows, rangeStart, rangeEnd) {
  const byDay = new Map(rows.map(r => [r.day, r]));
  const oneDay = 24 * 3600 * 1000;
  const dayCount = Math.round((rangeEnd - rangeStart) / oneDay);
  const buckets = [];
  for (let i = 0; i < dayCount; i++) {
    const t = rangeStart + i * oneDay;
    const r = byDay.get(dayKeyLocal(t));
    buckets.push(r ? { t, min: r.min, max: r.max, avg: r.sum / r.count } : null);
  }
  return buckets;
}

// ---------- Chart drawing ----------

function drawChart(buckets, rangeStart, rangeEnd) {
  const w = canvas.width, h = canvas.height;
  const padL = 36, padR = 8, padT = 10, padB = 20;
  const plotW = w - padL - padR, plotH = h - padT - padB;

  ctx.clearRect(0, 0, w, h);

  const present = buckets.filter(Boolean);
  if (present.length === 0) {
    ctx.fillStyle = '#8a8f98';
    ctx.font = '13px system-ui';
    ctx.fillText('No readings in this range — connect the sensor to start recording.', padL, h / 2);
    return;
  }

  let yMin = Math.min(...present.map(b => b.min));
  let yMax = Math.max(...present.map(b => b.max));
  if (yMax - yMin < 20) { const mid = (yMax + yMin) / 2; yMin = mid - 10; yMax = mid + 10; }
  yMin = Math.floor((yMin - 5) / 10) * 10;
  yMax = Math.ceil((yMax + 5) / 10) * 10;

  const xOf = (t) => padL + ((t - rangeStart) / (rangeEnd - rangeStart)) * plotW;
  const yOf = (bpm) => padT + (1 - (bpm - yMin) / (yMax - yMin)) * plotH;

  // Horizontal gridlines + y-axis labels
  ctx.strokeStyle = '#2a2e36';
  ctx.fillStyle = '#8a8f98';
  ctx.font = '11px system-ui';
  ctx.textBaseline = 'middle';
  const ySteps = 4;
  for (let i = 0; i <= ySteps; i++) {
    const val = yMin + (i / ySteps) * (yMax - yMin);
    const y = yOf(val);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillText(Math.round(val), 4, y);
  }

  // X-axis labels: hour-of-day for a single day, calendar dates for a wider range.
  ctx.textBaseline = 'top';
  const spanMs = rangeEnd - rangeStart;
  const oneDay = 24 * 3600 * 1000;

  if (spanMs <= oneDay + 60e3) {
    // Single day: label every 3 hours.
    for (let hr = 0; hr <= 24; hr += 3) {
      const t = rangeStart + hr * 3600 * 1000;
      if (t > rangeEnd) break;
      const x = xOf(t);
      const label = hr === 0 ? '12am' : hr < 12 ? `${hr}am` : hr === 12 ? '12pm' : `${hr - 12}pm`;
      ctx.fillText(label, x - 12, h - padB + 4);
    }
  } else {
    // Multi-day: label roughly 6 evenly-spaced calendar dates across the range.
    const dayCount = Math.round(spanMs / oneDay);
    const labelEvery = Math.max(1, Math.ceil(dayCount / 6));
    for (let d = 0; d <= dayCount; d += labelEvery) {
      const t = rangeStart + d * oneDay;
      if (t > rangeEnd) break;
      const x = xOf(t);
      const label = new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      ctx.fillText(label, x - 14, h - padB + 4);
    }
  }

  // Min-max band
  ctx.beginPath();
  let started = false;
  for (const b of buckets) {
    if (!b) continue;
    const x = xOf(b.t);
    if (!started) { ctx.moveTo(x, yOf(b.max)); started = true; }
    else ctx.lineTo(x, yOf(b.max));
  }
  for (let i = buckets.length - 1; i >= 0; i--) {
    const b = buckets[i];
    if (!b) continue;
    ctx.lineTo(xOf(b.t), yOf(b.min));
  }
  ctx.closePath();
  ctx.fillStyle = '#ff3b5c33';
  ctx.fill();

  // Average line
  ctx.beginPath();
  started = false;
  for (const b of buckets) {
    if (!b) continue;
    const x = xOf(b.t), y = yOf(b.avg);
    if (!started) { ctx.moveTo(x, y); started = true; }
    else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = '#ff3b5c';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function startOfDay(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x.getTime();
}

function formatRangeLabel(rangeStart, rangeEnd) {
  const today = startOfDay(new Date());
  const oneDay = 24 * 3600 * 1000;
  const start = new Date(rangeStart);
  const endInclusive = new Date(rangeEnd - 1); // rangeEnd is exclusive (midnight of the next day)

  if (rangeStart === today && rangeEnd === today + oneDay) return 'midnight – now';

  const opts = { month: 'short', day: 'numeric' };
  const startLabel = start.toLocaleDateString(undefined, opts);
  const endLabel = endInclusive.toLocaleDateString(undefined, opts);
  return startLabel === endLabel ? startLabel : `${startLabel} – ${endLabel}`;
}

async function refreshChart(rangeStart, rangeEnd, period) {
  // Called with no args to just redraw whatever range is already selected
  // (e.g. on a live update or the 30s tick); called with args when the
  // person picks a new range.
  if (rangeStart != null && rangeEnd != null) {
    currentRangeStart = rangeStart;
    currentRangeEnd = rangeEnd;
    currentPeriod = period || 'day';
  } else if (currentRangeStart == null) {
    currentRangeStart = startOfDay(new Date());
    currentRangeEnd = currentRangeStart + 24 * 3600 * 1000;
    currentPeriod = 'day';
  }

  const start = currentRangeStart, end = currentRangeEnd;
  const queryEnd = Math.min(Date.now(), end);

  let buckets;
  if (currentPeriod === 'month' || currentPeriod === 'year') {
    // Wide ranges read the small pre-aggregated table instead of every raw
    // reading — a year is ~365 rollup rows instead of tens of millions of
    // raw ones.
    const rows = await getRollupsInRange(start, queryEnd);
    buckets = bucketsFromRollups(rows, start, end);
  } else {
    const readings = await getReadingsInRange(start, queryEnd);
    const bucketMs = bucketSizeFor(end - start);
    buckets = bucketReadings(readings, bucketMs, start, end);
  }

  drawChart(buckets, start, end);
  chartRangeEl.textContent = formatRangeLabel(start, end);
}

function scheduleRedraw() {
  if (redrawScheduled) return;
  redrawScheduled = true;
  setTimeout(() => { redrawScheduled = false; refreshChart(); }, 2000);
}

// ---------- Date + period picker ----------

function toDateInputValue(ms) {
  const d = new Date(ms);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function setInputsToToday() {
  endDateInput.value = toDateInputValue(Date.now());
  periodSelect.value = 'day';
}

// Turn "ending on this date" + a period into a [start, end) range, where
// end is exclusive (midnight of the day *after* the chosen end date, so
// the end date itself is fully included).
function resolvePresetRange(endDateStr, period) {
  const [y, m, d] = endDateStr.split('-').map(Number);
  const endDay = new Date(y, m - 1, d);
  endDay.setHours(0, 0, 0, 0);
  const end = endDay.getTime() + 24 * 3600 * 1000;

  let start;
  switch (period) {
    case 'week':
      start = end - 7 * 24 * 3600 * 1000;
      break;
    case 'month': {
      // setMonth() alone rolls over on short months (Mar 31 minus a month
      // becomes Mar 3, not Feb 28), so clamp to the target month's last day.
      const s = new Date(endDay.getFullYear(), endDay.getMonth() - 1, 1);
      const daysInTargetMonth = new Date(s.getFullYear(), s.getMonth() + 1, 0).getDate();
      s.setDate(Math.min(endDay.getDate(), daysInTargetMonth));
      start = s.getTime();
      break;
    }
    case 'year': {
      const s = new Date(endDay); s.setFullYear(s.getFullYear() - 1);
      start = s.getTime();
      break;
    }
    default: // 'day'
      start = endDay.getTime();
  }
  return { start, end };
}

function viewSelectedRange() {
  if (!endDateInput.value) return;
  const period = periodSelect.value;
  const { start, end } = resolvePresetRange(endDateInput.value, period);
  refreshChart(start, end, period);
}

viewRangeBtn.addEventListener('click', viewSelectedRange);
todayBtn.addEventListener('click', () => {
  setInputsToToday();
  const today = startOfDay(new Date());
  refreshChart(today, today + 24 * 3600 * 1000, 'day');
});

// ---------- Backup: export / import ----------

const exportBtn = document.getElementById('exportBtn');
const importBtn = document.getElementById('importBtn');
const importFile = document.getElementById('importFile');
const backupStatusEl = document.getElementById('backupStatus');
const recordCountEl = document.getElementById('recordCount');

// Read every row in the store, in one pass.
function getAllReadings() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('readings', 'readonly');
    const req = tx.objectStore('readings').getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function updateRecordCount() {
  const all = await getAllReadings();
  recordCountEl.textContent = `${all.length.toLocaleString()} readings stored`;
  return all;
}

async function exportBackup() {
  const all = await getAllReadings();
  if (all.length === 0) {
    backupStatusEl.textContent = 'No readings to back up yet.';
    return;
  }
  // Strip the local auto-increment id — it has no meaning outside this browser's
  // database and would just create confusion (or collisions) on import elsewhere.
  const payload = {
    exportedAt: new Date().toISOString(),
    device: 'Polar Verity Sense',
    readings: all.map(r => ({ t: r.t, bpm: r.bpm }))
  };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `heart-rate-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  backupStatusEl.textContent = `Downloaded ${all.length.toLocaleString()} readings.`;
}

function bulkSaveReadings(readings) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('readings', 'readwrite');
    const store = tx.objectStore('readings');
    // No id field on purpose: let the store assign fresh ids so this never
    // collides with whatever is already here, and duplicate imports just
    // add duplicate rows rather than silently failing.
    for (const r of readings) store.add({ t: r.t, bpm: r.bpm });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function importBackup(file) {
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    const readings = Array.isArray(parsed) ? parsed : parsed.readings;
    if (!Array.isArray(readings)) throw new Error('Unrecognized file format.');
    const valid = readings.filter(r => typeof r.t === 'number' && typeof r.bpm === 'number');
    if (valid.length === 0) throw new Error('No valid readings found in that file.');
    await bulkSaveReadings(valid);
    // bulkSaveReadings writes raw readings directly, bypassing the
    // incremental rollup update saveReading() does — rebuild rollups fully
    // so the month/year views pick up the imported history too.
    await rebuildRollups();
    backupStatusEl.textContent = `Restored ${valid.length.toLocaleString()} readings.`;
    await updateRecordCount();
    await refreshChart();
  } catch (err) {
    backupStatusEl.textContent = `Couldn't restore that file: ${err.message}`;
  }
}

exportBtn.addEventListener('click', exportBackup);
importBtn.addEventListener('click', () => importFile.click());
importFile.addEventListener('change', () => {
  if (importFile.files[0]) importBackup(importFile.files[0]);
  importFile.value = '';
});

// ---------- BLE parsing ----------

function parseHeartRate(dataView) {
  const flags = dataView.getUint8(0);
  const is16Bit = flags & 0x01;
  const hasEnergy = flags & 0x08;
  const hasRR = flags & 0x10;
  let offset = 1;

  const bpm = is16Bit ? dataView.getUint16(offset, true) : dataView.getUint8(offset);
  offset += is16Bit ? 2 : 1;
  if (hasEnergy) offset += 2;

  const rr = [];
  if (hasRR) {
    while (offset + 1 < dataView.byteLength) {
      rr.push(Math.round(dataView.getUint16(offset, true) / 1024 * 1000)); // ms
      offset += 2;
    }
  }
  return { bpm, rr };
}

function onReading(event) {
  const { bpm, rr } = parseHeartRate(event.target.value);
  bpmEl.textContent = bpm;
  rrEl.textContent = rr.length ? `RR: ${rr.join(', ')} ms` : '';
  heartEl.classList.add('beat');
  setTimeout(() => heartEl.classList.remove('beat'), 120);

  saveReading(bpm);
  scheduleRedraw();
  readingsSinceCount++;
  if (readingsSinceCount >= 30) { readingsSinceCount = 0; updateRecordCount(); }
}
let readingsSinceCount = 0;

// ---------- Connection ----------

async function connect() {
  if (!navigator.bluetooth) {
    setStatus('This browser has no Web Bluetooth. Use Chrome or Edge on desktop or Android.');
    return;
  }
  try {
    setStatus('Choose your Polar sensor from the list…');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [HR_SERVICE] }, { namePrefix: 'Polar' }],
      optionalServices: [HR_SERVICE]
    });
    device.addEventListener('gattserverdisconnected', () => {
      setStatus('Disconnected. History is saved — reconnect anytime.');
      bpmEl.textContent = '--';
      btn.textContent = 'Connect sensor';
      btn.classList.remove('secondary');
    });

    setStatus(`Connecting to ${device.name}…`);
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(HR_SERVICE);
    const characteristic = await service.getCharacteristic(HR_MEASUREMENT);
    await characteristic.startNotifications();
    characteristic.addEventListener('characteristicvaluechanged', onReading);

    setStatus(`Connected to ${device.name}. Readings arrive about once per second and are saved locally.`);
    btn.textContent = 'Disconnect';
    btn.classList.add('secondary');
  } catch (err) {
    setStatus(`Couldn't connect: ${err.message}`);
  }
}

btn.addEventListener('click', () => {
  if (device && device.gatt.connected) device.gatt.disconnect();
  else connect();
});

// ---------- Init ----------

(async function init() {
  db = await openDB();
  setInputsToToday();

  // One-time backfill: if there's existing history but no rollups yet
  // (first load after this feature was added), build them once.
  const [rollupCount, readingCount] = await Promise.all([
    countStore('dailyRollups'),
    countStore('readings')
  ]);
  if (rollupCount === 0 && readingCount > 0) {
    backupStatusEl.textContent = 'Building history summaries…';
    await rebuildRollups();
    backupStatusEl.textContent = '';
  }

  await refreshChart();
  await updateRecordCount();
  setInterval(refreshChart, 30000); // keep the "now" edge of the chart moving even if idle
})();
</script>
